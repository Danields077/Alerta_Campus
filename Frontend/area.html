<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Atención de reportes | Alerta Campus</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="css/styles.css" />
  <link rel="stylesheet" href="css/modulo2.css" />
  <link rel="stylesheet" href="css/layout.css" />
</head>
<body>
  <header id="app-navbar"></header>
  <main class="contenido modulo-contenido">
    <div id="mensaje-global" aria-live="polite"></div>
    <section class="bienvenida">
      <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-3">
        <div>
          <h1 class="h3 mb-1">Atención de reportes</h1>
          <p class="text-muted mb-0" id="descripcion-area">Reportes asignados a tu área.</p>
        </div>
        <div class="d-flex gap-2">
          <select id="filtro-area" class="form-select w-auto" aria-label="Filtrar por área" hidden>
            <option value="">Todas las áreas</option>
          </select>
          <select id="filtro-estado" class="form-select w-auto" aria-label="Filtrar por estado">
            <option value="">Todos</option>
            <option>Pendiente</option>
            <option>En atención</option>
            <option>En verificación</option>
            <option>Cerrado</option>
          </select>
        </div>
      </div>

      <div class="table-responsive">
        <table class="table table-striped align-middle">
          <thead>
            <tr>
              <th>Folio</th>
              <th>Categoría</th>
              <th>Área</th>
              <th>Ubicación</th>
              <th>Reportante</th>
              <th>Prioridad</th>
              <th>Estado</th>
              <th>Acciones</th>
            </tr>
          </thead>
          <tbody id="filas-area"></tbody>
        </table>
      </div>
      <p id="sin-area" class="text-muted" hidden>No hay reportes para los filtros seleccionados.</p>
    </section>
  </main>

  <div class="modal fade" id="modal-atencion" tabindex="-1" aria-labelledby="modal-atencion-titulo" aria-hidden="true">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h2 class="modal-title fs-5" id="modal-atencion-titulo">Actualizar reporte</h2>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
        </div>
        <div class="modal-body">
          <p id="detalle-atencion" class="small text-muted"></p>
          <label class="form-label" for="nota-atencion">Nota o solución</label>
          <textarea class="form-control" id="nota-atencion" rows="4" maxlength="1000"></textarea>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancelar</button>
          <button type="button" class="btn btn-primary" id="confirmar-atencion">Confirmar</button>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/layout.js"></script>
  <script src="js/area.js"></script>
</body>
</html>
