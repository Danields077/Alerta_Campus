<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mis reportes | Alerta Campus</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="css/styles.css" />
  <link rel="stylesheet" href="css/modulo2.css" />
  <link rel="stylesheet" href="css/layout.css" />
</head>
<body>
  <header id="app-navbar"></header>
  <main class="contenido modulo-contenido">
    <div id="mensaje-global" aria-live="polite"></div>
    <section class="bienvenida mb-4">
      <h1 class="h3">Registrar incidencia</h1>
      <p class="text-muted">Completa los tres pasos. La evidencia es opcional.</p>
      <div class="progreso-pasos" aria-label="Progreso del formulario">
        <span data-indicador="1" class="paso-activo">1. Categoría</span>
        <span data-indicador="2">2. Ubicación</span>
        <span data-indicador="3">3. Descripción</span>
      </div>
      <form id="form-reporte" enctype="multipart/form-data" novalidate>
        <section data-paso="1">
          <label class="form-label" for="categoria">Categoría <span class="text-danger">*</span></label>
          <select class="form-select" id="categoria" name="id_categoria" required><option value="">Selecciona una categoría</option></select>
        </section>
        <section data-paso="2" hidden>
          <div class="row g-3">
            <div class="col-md-6"><label class="form-label" for="edificio">Edificio *</label><select class="form-select" id="edificio" required><option value="">Selecciona</option></select></div>
            <div class="col-md-6"><label class="form-label" for="piso">Piso *</label><select class="form-select" id="piso" required disabled><option value="">Selecciona</option></select></div>
            <div class="col-md-6"><label class="form-label" for="area-general">Área general *</label><select class="form-select" id="area-general" required disabled><option value="">Selecciona</option></select></div>
            <div class="col-md-6"><label class="form-label" for="espacio">Espacio específico *</label><select class="form-select" id="espacio" name="id_ubicacion" required disabled><option value="">Selecciona</option></select></div>
          </div>
        </section>
        <section data-paso="3" hidden>
          <label class="form-label" for="descripcion">Descripción <span class="text-danger">*</span></label>
          <textarea class="form-control" id="descripcion" name="descripcion" rows="5" maxlength="5000" required></textarea>
          <div class="form-text text-end"><span id="contador">0</span>/5000</div>
          <label class="form-label mt-3" for="evidencia">Evidencia opcional (JPG/PNG, máximo 5 MB)</label>
          <input class="form-control" type="file" id="evidencia" name="evidencia" accept=".jpg,.jpeg,.png,image/jpeg,image/png" />
          <div class="form-check mt-3">
            <input class="form-check-input" type="checkbox" id="confirmacion" required />
            <label class="form-check-label" for="confirmacion">Confirmo que la información es correcta.</label>
          </div>
        </section>
        <div class="d-flex justify-content-between gap-2 mt-4">
          <button type="button" class="btn btn-outline-secondary" id="paso-anterior" hidden>Anterior</button>
          <button type="button" class="btn btn-primary ms-auto" id="paso-siguiente">Siguiente</button>
          <button type="submit" class="btn btn-primary ms-auto" id="enviar-reporte" hidden>Registrar reporte</button>
        </div>
      </form>
    </section>

    <section class="bienvenida">
      <div class="d-flex flex-wrap justify-content-between align-items-center gap-2">
        <div><h2 class="h3">Historial y estatus</h2><p class="text-muted">Solo se muestran tus reportes.</p></div>
        <button id="exportar-historial" type="button" class="btn btn-outline-primary">Exportar historial PDF</button>
      </div>
      <form id="filtros-usuario" class="row g-2 mb-3">
        <div class="col-md-3"><label class="form-label" for="f-folio">Folio</label><input id="f-folio" name="folio" class="form-control" /></div>
        <div class="col-md-3"><label class="form-label" for="f-estado">Estado</label><select id="f-estado" name="estado" class="form-select"><option value="">Todos</option></select></div>
        <div class="col-md-3"><label class="form-label" for="f-categoria">Categoría</label><select id="f-categoria" name="categoria" class="form-select"><option value="">Todas</option></select></div>
        <div class="col-md-3"><label class="form-label" for="f-desde">Desde</label><input id="f-desde" name="desde" type="date" class="form-control" /></div>
        <div class="col-md-3"><label class="form-label" for="f-hasta">Hasta</label><input id="f-hasta" name="hasta" type="date" class="form-control" /></div>
        <div class="col-md-3 align-self-end"><button class="btn btn-primary" type="submit">Filtrar</button> <button class="btn btn-outline-secondary" id="limpiar-filtros" type="button">Limpiar</button></div>
      </form>
      <div class="table-responsive">
        <table class="table table-striped align-middle"><thead><tr><th>Folio</th><th>Categoría</th><th>Ubicación</th><th>Fecha</th><th>Estado</th><th></th></tr></thead><tbody id="filas-reportes"></tbody></table>
      </div>
      <p id="sin-reportes" class="text-muted" hidden>No se encontraron reportes</p>
      <nav aria-label="Paginación"><ul class="pagination" id="paginacion"></ul></nav>
    </section>
  </main>
  <div class="modal fade" id="modal-detalle" tabindex="-1" aria-labelledby="modal-titulo" aria-hidden="true">
    <div class="modal-dialog modal-lg modal-dialog-scrollable"><div class="modal-content">
      <div class="modal-header"><h2 class="modal-title fs-5" id="modal-titulo">Detalle del reporte</h2><button class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button></div>
      <div class="modal-body" id="detalle-contenido"></div>
    </div></div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/layout.js"></script>
  <script src="js/reportes.js"></script>
</body>
</html>
