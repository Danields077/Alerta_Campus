<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Consulta general | Alerta Campus</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="css/styles.css" />
  <link rel="stylesheet" href="css/modulo2.css" />
  <link rel="stylesheet" href="css/layout.css" />
</head>
<body>
  <header id="app-navbar"></header>
  <main class="contenido modulo-contenido">
    <div id="mensaje-global" aria-live="polite"></div>
    <section class="bienvenida">
      <div class="d-flex flex-wrap justify-content-between align-items-center gap-2">
        <div><h1 class="h3">Consulta general de reportes</h1><p class="text-muted">El alcance del Jefe de Departamento se limita a su área.</p></div>
        <button id="exportar-global" type="button" class="btn btn-outline-primary" hidden>Exportar consulta global PDF</button>
      </div>
      <form id="filtros-general" class="row g-2 mb-3">
        <div class="col-md-3"><label class="form-label" for="g-folio">Folio</label><input id="g-folio" name="folio" class="form-control" /></div>
        <div class="col-md-3"><label class="form-label" for="g-estado">Estado</label><select id="g-estado" name="estado" class="form-select"><option value="">Todos</option></select></div>
        <div class="col-md-3"><label class="form-label" for="g-categoria">Categoría</label><select id="g-categoria" name="categoria" class="form-select"><option value="">Todas</option></select></div>
        <div class="col-md-3" id="filtro-area"><label class="form-label" for="g-area">Área responsable</label><select id="g-area" name="area" class="form-select"><option value="">Todas</option></select></div>
        <div class="col-md-3"><label class="form-label" for="g-desde">Desde</label><input id="g-desde" name="desde" type="date" class="form-control" /></div>
        <div class="col-md-3"><label class="form-label" for="g-hasta">Hasta</label><input id="g-hasta" name="hasta" type="date" class="form-control" /></div>
        <div class="col-12"><small class="form-text">Por defecto se muestran los últimos 30 días. Borra las fechas para consultar todo el historial.</small></div>
        <div class="col-md-3"><label class="form-label" for="g-edificio">Edificio</label><select id="g-edificio" class="form-select"><option value="">Todos</option></select></div>
        <div class="col-md-3"><label class="form-label" for="g-piso">Piso</label><select id="g-piso" class="form-select" disabled><option value="">Todos</option></select></div>
        <div class="col-md-3"><label class="form-label" for="g-area-general">Área general</label><select id="g-area-general" class="form-select" disabled><option value="">Todas</option></select></div>
        <div class="col-md-3"><label class="form-label" for="g-espacio">Espacio específico</label><select id="g-espacio" name="ubicacion" class="form-select" disabled><option value="">Todos</option></select></div>
        <div class="col-12"><button class="btn btn-primary" type="submit">Aplicar filtros</button> <button class="btn btn-outline-secondary" id="limpiar-general" type="button">Limpiar</button></div>
      </form>
      <div class="table-responsive">
        <table class="table table-striped align-middle"><thead><tr><th>Folio</th><th>Categoría</th><th>Ubicación</th><th>Área</th><th>Estado</th><th>Fecha</th><th id="th-reportante" hidden>Reportante</th><th></th></tr></thead><tbody id="filas-generales"></tbody></table>
      </div>
      <p id="sin-generales" class="text-muted" hidden>No se encontraron reportes</p>
      <nav aria-label="Paginación"><ul class="pagination" id="paginacion-general"></ul></nav>
    </section>
  </main>
  <div class="modal fade" id="modal-detalle-general" tabindex="-1" aria-labelledby="modal-general-titulo" aria-hidden="true">
    <div class="modal-dialog modal-lg modal-dialog-scrollable"><div class="modal-content">
      <div class="modal-header"><h2 class="modal-title fs-5" id="modal-general-titulo">Detalle del reporte</h2><button class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button></div>
      <div class="modal-body" id="detalle-general-contenido"></div>
    </div></div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/layout.js"></script>
  <script src="js/consulta-general.js"></script>
</body>
</html>
