<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Crear cuenta | Alerta Campus</title>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <main class="pagina">

    <!-- Panel izquierdo: marca -->
    <section class="panel-marca">
      <!-- LOGO DEL ITZ: guarden su imagen como public/assets/logo-itz.png -->
      <img class="logo-itz" src="assets/logo-itz.png" alt="Logo TecNM Itzacatepec"
           onerror="this.onerror=null; this.src='assets/logo-placeholder.svg';" />
      <h1>Alerta Campus</h1>
      <p class="institucion">TecNM · Itzacatepec</p>
      <p class="lema">Plataforma de alertas para mantener segura a la comunidad del campus.</p>
    </section>

    <!-- Panel derecho: formulario -->
    <section class="panel-formulario">
      <div class="tarjeta">
        <h2>Crear cuenta</h2>
        <p class="subtitulo">Regístrate para usar Alerta Campus.</p>

        <div id="mensaje" class="mensaje" role="alert"></div>

        <form id="form-registro" novalidate>
          <div class="campo">
            <label for="nombre">Nombre completo</label>
            <input type="text" id="nombre" name="nombre" placeholder="Nombre y apellidos" autocomplete="name" required />
          </div>

          <div class="campo">
            <label for="identificador_institucional">Número de control o RFC</label>
            <input type="text" id="identificador_institucional" name="identificador_institucional" maxlength="50" required />
          </div>

          <div class="campo">
            <label for="correo">Correo electrónico</label>
            <input type="email" id="correo" name="correo" placeholder="correo@ejemplo.com" autocomplete="email" required />
          </div>

          <div class="campo campo-password">
            <label for="password">Contraseña</label>
            <input type="password" id="password" name="password" placeholder="Crea una contraseña" autocomplete="new-password" required />
            <button type="button" class="ver-password" data-target="password">Ver</button>
          </div>

          <div class="campo campo-password">
            <label for="confirmar">Confirmar contraseña</label>
            <input type="password" id="confirmar" name="confirmar" placeholder="Repite la contraseña" autocomplete="new-password" required />
            <button type="button" class="ver-password" data-target="confirmar">Ver</button>
          </div>

          <button type="submit" class="boton" id="btn-enviar">Crear cuenta</button>
        </form>

        <p class="enlace-alterno">¿Ya tienes cuenta? <a href="index.html">Inicia sesión</a></p>
      </div>
    </section>

  </main>

  <script src="js/auth.js"></script>
</body>
</html>
