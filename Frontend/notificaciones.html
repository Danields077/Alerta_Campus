<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Notificaciones | Alerta Campus</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="css/styles.css" />
  <link rel="stylesheet" href="css/layout.css" />
</head>
<body>
  <header id="app-navbar"></header>
  <main class="dashboard-main">
    <div id="mensaje-global" aria-live="polite"></div>
    <section class="bienvenida">
      <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-4">
        <div>
          <h1 class="h3 mb-1">Notificaciones</h1>
          <p class="text-muted mb-0">Avisos sobre los reportes. Se actualizan solos cada 30 segundos.</p>
        </div>
        <button type="button" class="btn btn-outline-primary" id="marcar-todas">Marcar todas como leídas</button>
      </div>

      <div class="row g-2 align-items-end mb-3">
        <div class="col-sm-5 col-lg-3">
          <label class="form-label" for="filtro-estado">Mostrar</label>
          <select class="form-select" id="filtro-estado">
            <option value="">Todas</option>
            <option value="no_leidas">No leídas</option>
            <option value="leidas">Leídas</option>
          </select>
        </div>
        <div class="col-sm-7 col-lg-9 text-sm-end">
          <span class="text-muted" id="resumen-notificaciones"></span>
        </div>
      </div>

      <div class="list-group" id="lista-notificaciones" aria-live="polite"></div>
      <p id="sin-notificaciones" class="text-muted mt-3" hidden>No tienes notificaciones</p>
      <nav class="mt-3" aria-label="Paginación de notificaciones">
        <ul class="pagination justify-content-center flex-wrap" id="paginacion-notificaciones"></ul>
      </nav>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/layout.js"></script>
  <script src="js/comun.js"></script>
  <script src="js/notificaciones.js"></script>
</body>
</html>
