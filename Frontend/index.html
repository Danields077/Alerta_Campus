<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Iniciar sesión | Alerta Campus</title>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <main class="pagina">

    <!-- Panel izquierdo: marca -->
    <section class="panel-marca">
      <!-- LOGO DEL ITZ: guarden su imagen como public/assets/logo-itz.png
           (si no existe, se muestra el logo provisional) -->
      <img class="logo-itz" src="assets/logo-itz.png" alt="Logo TecNM Itzacatepec"
           onerror="this.onerror=null; this.src='assets/logo-placeholder.svg';" />
      <h1>Alerta Campus</h1>
      <p class="institucion">TecNM · Itzacatepec</p>
      <p class="lema">Plataforma de alertas para mantener segura a la comunidad del campus.</p>
    </section>

    <!-- Panel derecho: formulario -->
    <section class="panel-formulario">
      <div class="tarjeta">
        <h2>Iniciar sesión</h2>
        <p class="subtitulo">Ingresa con tu cuenta para continuar.</p>

        <div id="mensaje" class="mensaje" role="alert"></div>

        <form id="form-login" novalidate>
          <div class="campo">
            <label for="correo">Correo electrónico</label>
            <input type="email" id="correo" name="correo" placeholder="correo@ejemplo.com" autocomplete="email" required />
          </div>

          <div class="campo campo-password">
            <label for="password">Contraseña</label>
            <input type="password" id="password" name="password" placeholder="Tu contraseña" autocomplete="current-password" required />
            <button type="button" class="ver-password" data-target="password">Ver</button>
          </div>

          <button type="submit" class="boton" id="btn-enviar">Iniciar sesión</button>
        </form>

        <p class="enlace-alterno">¿No tienes cuenta? <a href="registro.html">Regístrate</a></p>
      </div>
    </section>

  </main>

  <script src="js/auth.js"></script>
</body>
</html>
